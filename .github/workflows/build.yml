name: Build tpanel binaries

# باینری‌ها را خود گیت‌هاب می‌سازد تا لازم نباشد فایل باینری آپلود شود.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'web/**'
      - 'manager.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build amd64 + arm64
        env:
          CGO_ENABLED: '0'
          GOFLAGS: '-buildvcs=false'
        run: |
          go build -ldflags="-s -w" -o tpanel-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o tpanel-linux-arm64 .
          ls -lh tpanel-linux-*

      - name: Publish to Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v2.0.1
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Tunnel Panel $TAG" --notes "Single-binary tunnel panel (panel + agent). Download tpanel-linux-amd64 (or arm64), or just run the one-line installer from the README."
          gh release upload "$TAG" tpanel-linux-amd64 tpanel-linux-arm64 --clobber
